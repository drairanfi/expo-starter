name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Test with coverage
        run: npm run test:coverage -- --ci

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/lcov.info

      - name: Expo Doctor
        run: npx expo-doctor

  bundle:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        variant: [development, staging, production]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Resolve config (${{ matrix.variant }})
        run: npx expo config --type public
        env:
          APP_VARIANT: ${{ matrix.variant }}

      - name: Bundle smoke test, web (${{ matrix.variant }})
        run: npx expo export --platform web
        env:
          APP_VARIANT: ${{ matrix.variant }}

      - name: Bundle smoke test, native JS (${{ matrix.variant }})
        run: npx expo export --platform ios --platform android
        env:
          APP_VARIANT: ${{ matrix.variant }}
