# Install once with: npx lefthook install   (https://lefthook.dev)
pre-commit:
  parallel: false
  commands:
    format:
      glob: '*.{ts,tsx,js,json,md,yml,yaml}'
      run: npx prettier --check {staged_files}
    lint:
      glob: '*.{ts,tsx,js}'
      run: npx expo lint
    typecheck:
      glob: '*.{ts,tsx}'
      run: npm run typecheck

commit-msg:
  commands:
    conventional-commit:
      run: sh scripts/check_commit_msg.sh {1}
